<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e3e5e9;
    --accent: #2f7d5d;
    --accent-weak: #e6f2ec;
    --danger: #c0392b;
    --danger-weak: #fdecea;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a;
      --card: #1e2125;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2e3237;
      --accent: #5bbd90;
      --accent-weak: #22302b;
      --danger: #e5796b;
      --danger-weak: #3a2420;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a;
    --card: #1e2125;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --border: #2e3237;
    --accent: #5bbd90;
    --accent-weak: #22302b;
    --danger: #e5796b;
    --danger-weak: #3a2420;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }

  .wrap { max-width: 540px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  .updated { margin: 0 0 6px; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 11px 13px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak);
  }
  input[type="text"]:disabled { opacity: .6; }

  button {
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    border-radius: 9px;
    border: 1px solid transparent;
  }
  .add {
    padding: 11px 18px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    white-space: nowrap;
  }
  .add:hover:not(:disabled) { filter: brightness(1.07); }
  .add:disabled { opacity: .55; cursor: default; }

  .status {
    margin: 0;
    padding: 11px 14px;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .status.error {
    color: var(--danger);
    background: var(--danger-weak);
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }

  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex: none;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    word-break: break-word;
    cursor: pointer;
  }
  li.done .name {
    text-decoration: line-through;
    color: var(--muted);
  }

  .del {
    flex: none;
    width: 30px;
    height: 30px;
    line-height: 1;
    font-size: 18px;
    background: transparent;
    color: var(--muted);
  }
  .del:hover { background: var(--accent-weak); color: var(--danger); }

  .empty {
    padding: 42px 16px;
    margin: 0;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .clear {
    padding: 6px 11px;
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .clear:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); }
  .clear:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="updated">last updated : 2026.10.18</p>
    <h1>쇼핑 리스트</h1>
    <p class="sub">장 볼 물건을 적어두고 담을 때마다 체크하세요. 목록은 Supabase에 저장되어 다른 기기에서 열어도 같은 내용이 보입니다.</p>
  </header>

  <div class="card">
    <form id="form" autocomplete="off">
      <input type="text" id="input" placeholder="예: 우유 2개" aria-label="추가할 품목" disabled>
      <button type="submit" class="add" id="add" disabled>추가</button>
    </form>

    <p class="status" id="status" role="status">불러오는 중…</p>
    <ul id="list"></ul>
    <p class="empty" id="empty" style="display:none">아직 품목이 없습니다. 위에 입력해 추가하세요.</p>

    <footer>
      <span id="count"></span>
      <button type="button" class="clear" id="clear" disabled>체크한 항목 비우기</button>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  // publishable 키는 브라우저에 공개되는 값이다. 실제 접근 범위는
  // shopping_items 테이블의 RLS 정책으로 정해진다.
  const SUPABASE_URL = 'https://zrxdynvmknxebxumcbyz.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_pYmJIwIhS8F_jVmN23PY0w_fYfT6gBl';
  const TABLE = 'shopping_items';
  const LEGACY_KEY = 'shopping-list-items'; // 이전 버전이 localStorage에 쓰던 키

  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const addBtn = document.getElementById('add');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  const clearBtn = document.getElementById('clear');
  const status = document.getElementById('status');

  let items = [];
  let client = null;

  function setStatus(message, isError) {
    status.textContent = message || '';
    status.style.display = message ? 'block' : 'none';
    status.classList.toggle('error', !!isError);
  }

  function fail(what, error) {
    setStatus(what + ': ' + (error && error.message ? error.message : '알 수 없는 오류'), true);
  }

  function setBusy(busy) {
    input.disabled = busy;
    addBtn.disabled = busy;
  }

  function render() {
    list.textContent = '';

    items.forEach(item => {
      const li = document.createElement('li');
      if (item.done) li.className = 'done';

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = item.done;
      box.setAttribute('aria-label', item.name + ' 체크');
      box.addEventListener('change', () => toggle(item.id));

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      name.addEventListener('click', () => toggle(item.id));

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '×';
      del.title = '삭제';
      del.setAttribute('aria-label', item.name + ' 삭제');
      del.addEventListener('click', () => remove(item.id));

      li.append(box, name, del);
      list.appendChild(li);
    });

    const done = items.filter(it => it.done).length;
    empty.style.display = items.length ? 'none' : 'block';
    count.textContent = items.length
      ? '전체 ' + items.length + '개 · 완료 ' + done + '개'
      : '';
    clearBtn.disabled = done === 0;
  }

  // 이전 버전이 localStorage에 남긴 목록이 있으면 한 번만 DB로 옮기고 키를 지운다.
  async function importLegacyItems() {
    let legacy;
    try {
      legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
    } catch (e) {
      legacy = null;
    }
    if (!Array.isArray(legacy)) return;

    const rows = legacy
      .filter(it => it && typeof it.name === 'string' && it.name.trim())
      .map(it => ({ name: it.name.trim(), done: !!it.done }));

    if (rows.length) {
      const { error } = await client.from(TABLE).insert(rows);
      if (error) {
        fail('이전 목록을 옮기지 못했습니다', error);
        return;
      }
    }
    try {
      localStorage.removeItem(LEGACY_KEY);
    } catch (e) {
      /* 저장소 접근이 막혀 있으면 무시한다 */
    }
  }

  async function reload() {
    setStatus('불러오는 중…');
    const { data, error } = await client
      .from(TABLE)
      .select('id, name, done')
      .order('created_at', { ascending: true });

    if (error) {
      fail('목록을 불러오지 못했습니다', error);
      return;
    }

    items = data || [];
    setStatus('');
    setBusy(false);
    render();
  }

  async function add(name) {
    setBusy(true);
    const { data, error } = await client
      .from(TABLE)
      .insert({ name: name })
      .select('id, name, done')
      .single();
    setBusy(false);

    if (error) {
      fail('추가하지 못했습니다', error);
      return;
    }

    items.push(data);
    setStatus('');
    render();
    input.focus();
  }

  async function toggle(id) {
    const item = items.find(it => it.id === id);
    if (!item) return;

    const next = !item.done;
    const { error } = await client.from(TABLE).update({ done: next }).eq('id', id);

    if (error) {
      fail('체크 상태를 바꾸지 못했습니다', error);
      render(); // 화면에 먼저 반영된 체크 표시를 되돌린다
      return;
    }

    item.done = next;
    setStatus('');
    render();
  }

  async function remove(id) {
    const { error } = await client.from(TABLE).delete().eq('id', id);

    if (error) {
      fail('삭제하지 못했습니다', error);
      return;
    }

    items = items.filter(it => it.id !== id);
    setStatus('');
    render();
  }

  async function clearDone() {
    const ids = items.filter(it => it.done).map(it => it.id);
    if (!ids.length) return;

    const { error } = await client.from(TABLE).delete().in('id', ids);

    if (error) {
      fail('완료 항목을 비우지 못했습니다', error);
      return;
    }

    items = items.filter(it => !it.done);
    setStatus('');
    render();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name || !client) return;
    input.value = '';
    add(name);
  });

  clearBtn.addEventListener('click', clearDone);

  async function init() {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      setStatus('Supabase 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인하세요.', true);
      return;
    }
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    await importLegacyItems();
    await reload();
    input.focus();
  }

  window.__appReady = init();
})();
</script>
</body>
</html>
